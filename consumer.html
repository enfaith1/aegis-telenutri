<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis Telenutri | Consumer</title><link rel="stylesheet" href="style.css"></head><body>
<header id="nav"></header>
<main><div class="grid">
<section class="card"><h2>Log a Meal</h2>
<label>Meal</label><select id="type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
<label>Food / description</label><input id="food" placeholder="Grilled chicken & rice">
<label>Calories</label><input id="cal" type="number" min="0" placeholder="450">
<button id="addMeal">Save meal</button>
<h2 style="margin-top:20px">My Meals</h2><div id="meals"></div></section>

<section class="card"><h2>Book a Consultation</h2>
<label>Date</label><input id="date" type="date">
<label>Time</label><select id="time"><option>09:00</option><option>10:00</option><option>11:00</option><option>13:00</option><option>14:00</option><option>15:00</option></select>
<label>Dietitian</label><select id="diet"><option>Dr. Santos</option><option>Dr. Reyes</option></select>
<button id="book">Book appointment</button>
<h2 style="margin-top:20px">My Appointments</h2><div id="appts"></div>
<h2 style="margin-top:20px">Notes from my dietitian</h2><div id="notes"></div></section>
</div></main>
<script src="app.js"></script><script src="consumer.js"></script></body></html>
